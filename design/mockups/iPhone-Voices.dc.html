<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voices · iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0D14; color: #F2EFE8; font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif">

  <div style="position: absolute; top: 54px; left: 12px; right: 12px; height: 44px; display: flex; align-items: center">
    <a href="iPhone-Settings.dc.html" aria-label="Back to Settings" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid rgba(255,255,255,0.08); background: #17151F; color: #F2EFE8; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="position: absolute; left: 50%; top: 0; height: 44px; transform: translateX(-50%); display: flex; align-items: center; gap: 7px">
      <svg viewBox="11.5 9.5 41 45" width="19" height="21" aria-hidden="true"><defs><linearGradient id="vcA" gradientUnits="userSpaceOnUse" x1="14" y1="10" x2="50" y2="54"><stop offset="0" stop-color="#DDD6FE"></stop><stop offset=".45" stop-color="#A78BFA"></stop><stop offset="1" stop-color="#7C3AED"></stop></linearGradient></defs><path d="M18 48V16L46 48V16" fill="none" stroke="url(#vcA)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="18" cy="16" r="6.5" fill="#DDD6FE"></circle><circle cx="18" cy="48" r="6.5" fill="#A78BFA"></circle><circle cx="46" cy="48" r="6.5" fill="#8B5CF6"></circle><circle cx="46" cy="16" r="6.5" fill="#7C3AED"></circle></svg>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 3px; color: #C4B5FD">NODUS</span>
      <span style="font-size: 10px; font-weight: 500; letter-spacing: 2px; color: #A8A3B5">/ READER</span>
    </div>
  </div>

  <div style="position: absolute; top: 112px; left: 20px; right: 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: Newsreader, ui-serif, Georgia, serif; font-weight: 400; font-size: 36px; letter-spacing: -0.9px; line-height: 1.05">Voices</h1>
      <p style="margin: 0; font-size: 14px; color: #A8A3B5; line-height: 1.4">Downloaded to this iPhone only. Never synced to iCloud.</p>
    </div>

    <div role="tablist" aria-label="Voices and models" style="height: 36px; padding: 3px; box-sizing: border-box; border-radius: 18px; background: #17151F; border: 1px solid rgba(255,255,255,0.08); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
      <a href="iPhone-Voices.dc.html" role="tab" aria-selected="true" style="border-radius: 15px; background: #2A2638; color: #F2EFE8; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Voices</a>
      <a href="iPhone-Models.dc.html" role="tab" aria-selected="false" style="border-radius: 15px; color: #F2EFE8; font-size: 13px; text-decoration: none; display: flex; align-items: center; justify-content: center">Models</a>
    </div>

    <label style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 22px; background: #17151F; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 8px; color: #A8A3B5">
      <svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" placeholder="Search voices" aria-label="Search voices" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #F2EFE8; font-size: 15px; font-family: inherit; outline: none">
    </label>

    <div style="display: flex; gap: 8px; align-items: center">
      <button aria-haspopup="menu" aria-expanded="true" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid rgba(196,181,253,0.45); background: #1E1A2B; color: #F2EFE8; font-size: 13px; font-family: inherit; display: flex; align-items: center; gap: 6px"><span style="color: #A8A3B5">Model</span>All<svg class="i" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button aria-haspopup="menu" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: #C4B5FD; color: #16121F; font-size: 13px; font-weight: 600; font-family: inherit; display: flex; align-items: center; gap: 6px"><span style="font-weight: 400">Language</span>Español<svg class="i" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button style="margin-left: auto; height: 36px; padding: 0 4px; border: 0; background: transparent; color: #C4B5FD; font-size: 13px; font-family: inherit">Clear</button>
    </div>

    <div style="display: flex; flex-direction: column">
      <span style="font-size: 12px; color: #A8A3B5; padding-bottom: 4px">4 voices · Español</span>
      <sc-for list="{{voices}}" as="v" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.07)">
          <button aria-label="{{v.actionLabel}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.1); background: #17151F; color: #F2EFE8; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <sc-if value="{{v.installed}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></sc-if>
            <sc-if value="{{v.notInstalled}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 5v10M8 11l4 4 4-4M5 19h14"></path></svg></sc-if>
          </button>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 500">{{v.name}}</span><sc-if value="{{v.isDefault}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 5px; background: rgba(196,181,253,0.16); color: #C4B5FD">BOOK DEFAULT</span></sc-if></span>
            <span style="font-size: 12px; color: #A8A3B5">{{v.meta}}</span>
          </span>
          <button aria-label="Favorite" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{v.starColor}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z" fill="{{v.starFill}}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg></button>
        </div>
      </sc-for>
    </div>
  </div>

  <div role="menu" aria-label="Filter by model" style="position: absolute; left: 20px; top: 346px; width: 252px; box-sizing: border-box; padding: 6px; border-radius: 16px; background: rgba(38,35,50,0.98); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 24px 50px rgba(0,0,0,0.55); display: flex; flex-direction: column">
    <sc-for list="{{models}}" as="m" hint-placeholder-count="5">
      <button role="menuitemradio" aria-checked="{{m.checked}}" style="min-height: 42px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #F2EFE8; font-size: 14px; font-family: inherit; display: flex; align-items: center; gap: 10px; text-align: left">
        <span style="width: 16px; display: flex; color: #C4B5FD">{{m.mark}}</span>
        <span style="flex-grow: 1">{{m.name}}</span>
        <span style="font-size: 11px; color: #A8A3B5">{{m.note}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const v = [
      { name: 'Dora', meta: 'Kokoro 82M · Español', isDefault: true, fav: true, installed: true },
      { name: 'Alex', meta: 'Kokoro 82M · Español', fav: false, installed: true },
      { name: 'Santa', meta: 'Kokoro 82M · Español', fav: false, installed: true },
      { name: '[Voice name]', meta: 'Phonon 40M Spanish · Downloading', fav: false, installed: false }
    ];
    const models = [
      { name: 'All models', checked: 'true', mark: '✓', note: '' },
      { name: 'Kokoro 82M', checked: 'false', mark: '', note: 'Installed' },
      { name: 'Phonon 31M', checked: 'false', mark: '', note: '' },
      { name: 'Phonon 40M Spanish', checked: 'false', mark: '', note: '64%' },
      { name: 'Phonon 40M Multilingual', checked: 'false', mark: '', note: '' }
    ];
    return {
      models,
      voices: v.map((x) => ({ isDefault: false, ...x, notInstalled: !x.installed, actionLabel: x.installed ? 'Play sample' : 'Download voice', starColor: x.fav ? '#C4B5FD' : '#A8A3B5', starFill: x.fav ? '#C4B5FD' : 'none' }))
    };
  }
}
</script>
</body>
</html>
