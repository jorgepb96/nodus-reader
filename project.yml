name: NodusReader
options:
  bundleIdPrefix: ai.nodus
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "10"
    # English is the base language and Spanish the one translation: a device
    # in Spanish shows Spanish, any other language shows English.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6RPLS9EA4X

packages:
  DesignSystem:
    path: Modules/DesignSystem
  PhononTTS:
    path: Modules/PhononTTS
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  KokoroCoreML:
    url: https://github.com/mattmireles/kokoro-coreml.git
    revision: 43ef0237306c3c1ea0138098c9f92930ae4cf3f7
  # Already part of Kokoro's English phonemizer (MisakiSwift). Linked directly,
  # at the version Kokoro resolves, only to free MLX's GPU buffer cache when the
  # voice engines are unloaded.
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4

targets:
  NodusReader:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NodusReader
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: NodusReader/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: DesignSystem
        product: DesignSystem
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: PhononTTS
        product: ptts
      - package: KokoroCoreML
        product: KokoroTTS
      - package: MLXSwift
        product: MLX
      - target: NodusReaderShare
        platformFilter: iOS
    settings:
      base:
        INFOPLIST_FILE: NodusReader/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/NodusReader.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ai.nodus.reader
        PRODUCT_NAME: Nodus Reader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Nodus Research. AGPL-3.0-only."
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    scheme:
      testTargets:
        - NodusReaderTests
        - NodusReaderUITests

  NodusReaderTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NodusReaderTests
    dependencies:
      - target: NodusReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nodus.reader.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nodus Reader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Nodus Reader"
        BUNDLE_LOADER: "$(TEST_HOST)"

  NodusReaderShare:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: NodusShareExtension
        excludes:
          - Info.plist
      - path: Shared
      - path: NodusReader/Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: DesignSystem
        product: DesignSystem
    settings:
      base:
        INFOPLIST_FILE: NodusShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/NodusReaderShare.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ai.nodus.reader.share
        PRODUCT_NAME: NodusReaderShare
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  NodusReaderUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: NodusReaderUITests
    dependencies:
      - target: NodusReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nodus.reader.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NodusReader
